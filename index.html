let WARMING=0,WMIN=null;const WARM={};
function warm(){const key=innerWidth+"x"+innerHeight;if(WARM[key])return;WARM[key]=1;
  const sq=QS,si=i,sc=scr;WARMING=1;WMIN={w:1e9,eh:1e9,z:1};
  try{delete FS[key];BANK.forEach(q=>{QS=[q];i=0;show(true);});}catch(e){}
  WARMING=0;QS=sq;i=si;
  if(WMIN.w<1e9)FS[key]={w:WMIN.w+"px",eh:WMIN.eh<1e9?WMIN.eh+"px":"",z:WMIN.eh<1e9?String(WMIN.z):"1"};WMIN=null;}
function fitScene(){fitScene0();try{const an=document.querySelector(".animal.scn");if(!an)return;
  if(WARMING){const w=parseFloat(an.style.getPropertyValue("--sw"))||1e9,eh=parseFloat(app.style.getPropertyValue("--eh")),z=parseFloat(app.style.getPropertyValue("--z"))||1;
    if(w<WMIN.w)WMIN.w=w;if(eh&&eh<WMIN.eh){WMIN.eh=eh;WMIN.z=z;}return;}
  const key=innerWidth+"x"+innerHeight,cp=document.querySelector(".copy"),nx=document.getElementById("nx");if(!FS[key]&&nx.getBoundingClientRect().bottom<=cp.getBoundingClientRect().top-4)FS[key]={eh:app.style.getPropertyValue("--eh"),z:app.style.getPropertyValue("--z"),w:an.style.getPropertyValue("--sw")};}catch(e){}}
function fitScene0(){try{measureTexts();const an=document.querySelector(".animal.scn");if(!an)return;
  {const key=innerWidth+"x"+innerHeight,c=FS[key];if(c){app.style.setProperty("--eh",c.eh);app.style.setProperty("--z",c.z);an.style.setProperty("--sw",c.w);
    const cp0=document.querySelector(".copy"),nx0=document.getElementById("nx");if(nx0.getBoundingClientRect().bottom<=cp0.getBoundingClientRect().top-4&&app.scrollHeight<=app.clientHeight+1)return;}}
  const cp=document.querySelector(".copy"),nx=document.getElementById("nx");
  app.style.setProperty("--eh","");app.style.setProperty("--z","1");
  const ok=()=>nx.getBoundingClientRect().bottom<=cp.getBoundingClientRect().top-4&&app.scrollHeight<=app.clientHeight+1;
  const cs=getComputedStyle(app),maxw=Math.min(app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),1000);
  let w=maxw;an.style.setProperty("--sw",w+"px");
  for(let k=0;k<60&&!ok()&&w>90;k++){w=Math.round(w*0.95);an.style.setProperty("--sw",w+"px");}
  app.style.setProperty("--eh","");app.style.setProperty("--z","1");
  if(w<maxw-2){const E0=document.querySelector(".opt .e"),e0=E0.getBoundingClientRect().height,minE=innerHeight<660?56:84;let best={w:w,eh:0};
    for(let eh=e0*.88;eh>=minE-1;eh*=.88){const h2=Math.max(minE,Math.round(eh));app.style.setProperty("--eh",h2+"px");app.style.setProperty("--z",(h2/e0).toFixed(3));
      let w2=maxw;an.style.setProperty("--sw",w2+"px");for(let k=0;k<60&&!ok()&&w2>90;k++){w2=Math.round(w2*0.95);an.style.setProperty("--sw",w2+"px");}
      if(w2>best.w){best={w:w2,eh:h2};}if(w2>=maxw-2||h2<=minE)break;}
    if(best.eh){app.style.setProperty("--eh",best.eh+"px");app.style.setProperty("--z",(best.eh/e0).toFixed(3));}else{app.style.setProperty("--eh","");app.style.setProperty("--z","1");}
    w=best.w;an.style.setProperty("--sw",w+"px");return;}
  if(w>=maxw-2){const sp=cp.getBoundingClientRect().top-4-nx.getBoundingClientRect().bottom;
    if(sp>30){const e0=document.querySelector(".opt .e").getBoundingClientRect().height,eh=Math.min(260,Math.round(e0+sp*0.7));app.style.setProperty("--eh",eh+"px");app.style.setProperty("--z",(eh/e0).toFixed(2));
      for(let k=0;k<12&&!ok();k++){const c=Math.round(parseFloat(getComputedStyle(document.querySelector(".opt .e")).height)-8);app.style.setProperty("--eh",c+"px");app.style.setProperty("--z",(c/e0).toFixed(2));}}}}catch(e){}}
function fitCards(){try{const es=[...document.querySelectorAll(".sceneq .opt .e")];if(!es.length)return;
  const z0=parseFloat(getComputedStyle(app).getPropertyValue("--z"))||1;es.forEach(x=>x.style.removeProperty("--z"));
  es.forEach(x=>{let z=z0;for(let t=0;t<30;t++){x.style.setProperty("--z",z.toFixed(3));const er=x.getBoundingClientRect();let l=1e9,r=-1e9,tp=1e9,bt=-1e9;
    x.querySelectorAll("img,.emo,.bar,.gl,.rope,.tw").forEach(el=>{const b=el.getBoundingClientRect();if(!b.width&&!b.height)return;l=Math.min(l,b.left);r=Math.max(r,b.right);tp=Math.min(tp,b.top);bt=Math.max(bt,b.bottom);});
    if(r<l)break;const ow=(r-l),oh=(bt-tp);if(l>=er.left-1&&r<=er.right+1&&tp>=er.top-1&&bt<=er.bottom+1)break;
    const k=Math.min(er.width/Math.max(1,ow),er.height/Math.max(1,oh),1);z=Math.max(.1,z*k*0.96);}x._z=z;});
  if(es.some(x=>x.querySelector("img[data-ov]"))){const mz=Math.min(...es.map(x=>x._z));es.forEach(x=>x.style.setProperty("--z",mz.toFixed(3)));}}catch(e){}}
addEventListener("resize",()=>{if(scr==="q"&&!WARM[innerWidth+"x"+innerHeight]&&!locked){show();return;}fitScene();fitCards();});
function show(dry){

   <div class="bubble"><p class="q">${q.text}</p><button class="say" id="say">🔊 再聽一次</button></div></div>

function confuse(q,k,btn){const an=document.getElementById("an");an.classList.remove("happy");setImg((k!=null&&(q.kind==="emo"?k===Math.max(...[0,1,2].filter(x=>x!==q.ai)):rk(q.vals,k)===1)&&scn(q,"d"))||scn(q,"b")||pose("think",q.word));

function pick(b,q){
  if(locked)return;const an=document.getElementById("an");
  if(+b.dataset.k!==q.ai){
    sfx("wrong");b.classList.add("soft","off");wrongFace(q,+b.dataset.k,b);
    window.wc=(window.wc||0)+1;const w1=window.wc%2===1,wt=w1?"嗯…再重新比比看，哪一個才對呢？":"再比一比喔～";document.getElementById("msg").textContent=wt;playVox(w1?"wrong1":"wrong2",()=>speak(wt));return;

function burst(el){

   document.body.appendChild(s);const a=k/10*Math.PI*2,d=70+Math.random()*50;
